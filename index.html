<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower Field</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- First-time popup -->
  <div class="first-popup">
    Welcome bae 😊! Click on any flower that you like!
  </div>
  <div class="field">
    <picture>
      <source media="(max-width: 480px)" srcset="images/cosmos-mobile.png">
      <img src="images/cosmos.png" class="flower" data-song="music/Burning.mp3"
        data-message="You are a beautiful blend of softness and tenderness, wrapped in a core of strength and fortitude. I love both your sides!">
    </picture>
    <picture>
      <source media="(max-width: 480px)" srcset="images/daisy-mobile.png">
      <img src="images/daisy.png" class="flower" data-song="music/You Complete Me.mp3"
        data-message="These are daisy flowers that symbolize innocence and purity. This is you through my eyes.">
    </picture>
    <picture>
      <source media="(max-width: 480px)" srcset="images/delphinium-mobile.png">
      <img src="images/delphinium.png" class="flower" data-song="music/Mojito.mp3"
        data-message="Can you guess what flower this is? It's a delphinium, just like our connection, because delphiniums represent strong bonds of love and deep affection.">
    </picture>
    <picture>
      <source media="(max-width: 480px)" srcset="images/lavender-mobile.png">
      <img src="images/lavender.png" class="flower" data-song="music/Until-You-Little Music.mp3"
        data-message="I can't bring you a beautiful bouquet right now, so I want to send you this in my own way. I hope you can see the most favourite flower you like 😉">
    </picture>
    <picture>
      <source media="(max-width: 480px)" srcset="images/forget-me-not-mobile.png">
      <img src="images/forget me not.png" class="flower" data-song="music/Everytime We Touch.mp3"
        data-message="Forget me not is the name of this flower. Just like its name, I will never forget you.">
    </picture>
  </div>

  <!-- Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-box">
      <span id="popup-message"></span>
      <button id="close-popup">X</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
